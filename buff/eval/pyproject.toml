[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "buff-eval"
version = "0.0.1alpha1"
description = "BUFF evaluation"
authors = [
  {name = "Marcelo Lerendegui", email = "marcelo@lerendegui.com"},
  {name = "Kai Riemer", email = "kr616@ic.ac.uk"}
]
license = {text  = "MIT"}
requires-python = ">=3.8"
dependencies = [
  "matplotlib",
  "numpy",
  "scipy",
  "pyqt5",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.3",
    "black>=21.5b1",
]

[tool.setuptools]
package-dir = {buff.eval = "eval"}

[tool.pytest.ini_options]
addopts = "-v -s"
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/marcelolerendegui/buff"
Repository = "https://github.com:marcelolerendegui/buff.git"
"Bug Tracker" = "https://github.com/marcelolerendegui/buff/issues"
Changelog = "https://github.com/marcelolerendegui/buff/CHANGELOG.md"
